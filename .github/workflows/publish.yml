name: Publish to ESP Component Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (gcc)
        run: make -C test CC=gcc && rm -rf test/build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install idf-component-manager
        run: pip install idf-component-manager
      - name: Upload component
        run: compote component upload --namespace train-horn --name train_horn_ctl
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
